<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0b1120;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#111c38;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0b1120;stop-opacity:1" />
    </linearGradient>

    <!-- Accent Top Line Gradient (Synology Blue) -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#0082c9;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#00a4e4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#38bdf8;stop-opacity:1" />
    </linearGradient>

    <!-- NAS Tower Chassis Gradient -->
    <linearGradient id="nasChassis" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e293b;stop-opacity:0.95" />
      <stop offset="100%" style="stop-color:#0f172a;stop-opacity:0.98" />
    </linearGradient>

    <!-- NAS Bay Gradient -->
    <linearGradient id="bayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#16213e;stop-opacity:0.85" />
      <stop offset="100%" style="stop-color:#1a1a2e;stop-opacity:0.95" />
    </linearGradient>

    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#1e293b" stroke-width="0.75" stroke-opacity="0.4"/>
    </pattern>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)" opacity="0.6"/>

  <!-- Accent Line Top -->
  <rect x="0" y="0" width="1200" height="4" fill="url(#accent)"/>

  <!-- Ambient Glow Behind NAS Illustration -->
  <circle cx="180" cy="150" r="120" fill="#0082c9" opacity="0.15" />
  <circle cx="180" cy="150" r="80" fill="#00a4e4" opacity="0.18" />

  <!-- ======================================================== -->
  <!-- LEFT: Synology NAS Tower Illustration                    -->
  <!-- ======================================================== -->
  <g transform="translate(180, 150) scale(1.05)">
    <!-- Main Tower Chassis -->
    <rect x="-70" y="-77" width="140" height="154" rx="14"
          fill="url(#nasChassis)"
          stroke="#00a4e4"
          stroke-width="3"
          stroke-linejoin="round"/>

    <!-- Left Drive Bay -->
    <g transform="translate(-52, -54)">
      <rect x="0" y="0" width="44" height="110" rx="6"
            fill="url(#bayGrad)"
            stroke="#00a4e4"
            stroke-width="2"
            stroke-opacity="0.8"/>
      <rect x="8" y="14" width="28" height="6" rx="2" fill="#0082c9" opacity="0.75"/>
      <line x1="12" y1="36" x2="32" y2="36" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="46" x2="32" y2="46" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="56" x2="32" y2="56" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="66" x2="32" y2="66" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="76" x2="32" y2="76" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <circle cx="22" cy="94" r="3.5" fill="#22c55e"/>
    </g>

    <!-- Right Drive Bay -->
    <g transform="translate(8, -54)">
      <rect x="0" y="0" width="44" height="110" rx="6"
            fill="url(#bayGrad)"
            stroke="#00a4e4"
            stroke-width="2"
            stroke-opacity="0.8"/>
      <rect x="8" y="14" width="28" height="6" rx="2" fill="#0082c9" opacity="0.75"/>
      <line x1="12" y1="36" x2="32" y2="36" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="46" x2="32" y2="46" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="56" x2="32" y2="56" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="66" x2="32" y2="66" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <line x1="12" y1="76" x2="32" y2="76" stroke="#475569" stroke-width="2" stroke-linecap="round"/>
      <circle cx="22" cy="94" r="3.5" fill="#22c55e"/>
    </g>

    <!-- Front Status Panel (Top Header) -->
    <circle cx="-30" cy="-66" r="3" fill="#38bdf8"/>
    <circle cx="-18" cy="-66" r="3" fill="#22c55e"/>
    <circle cx="-6" cy="-66" r="3" fill="#eab308" opacity="0.8"/>
    <rect x="30" y="-70" width="22" height="8" rx="3" fill="#0082c9" stroke="#38bdf8" stroke-width="1.2"/>
  </g>

  <!-- ======================================================== -->
  <!-- CENTER: Typography & Features                            -->
  <!-- ======================================================== -->
  <g transform="translate(360, 0)">
    <!-- Subtitle Category Tag -->
    <text x="0" y="68" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#00a4e4" letter-spacing="3">WHMCS SERVER MODULE</text>

    <!-- Main Module Title -->
    <text x="0" y="132" font-family="Arial, sans-serif" font-size="62" font-weight="900" fill="#ffffff" letter-spacing="2">SYNOLOGY</text>

    <!-- Gradient Divider -->
    <rect x="0" y="152" width="500" height="4" fill="url(#accent)" rx="2"/>

    <!-- Feature 1 -->
    <g transform="translate(0, 188)">
      <circle cx="7" cy="-5" r="4" fill="#00a4e4"/>
      <text x="22" y="0" font-family="Arial, sans-serif" font-size="15" fill="#f1f5f9" font-weight="500">Automated DSM User Account Provisioning &amp; Shared Folder Quota Setup</text>
    </g>

    <!-- Feature 2 -->
    <g transform="translate(0, 218)">
      <circle cx="7" cy="-5" r="4" fill="#00a4e4"/>
      <text x="22" y="0" font-family="Arial, sans-serif" font-size="15" fill="#f1f5f9" font-weight="500">Real-Time Storage Space Analytics &amp; Disk Usage Threshold Monitoring</text>
    </g>

    <!-- Feature 3 -->
    <g transform="translate(0, 248)">
      <circle cx="7" cy="-5" r="4" fill="#00a4e4"/>
      <text x="22" y="0" font-family="Arial, sans-serif" font-size="15" fill="#f1f5f9" font-weight="500">Native DSM Group Management, Granular Service Permissions &amp; Client Area</text>
    </g>
  </g>

  <!-- ======================================================== -->
  <!-- RIGHT: PUQ Software Branding & Badge                     -->
  <!-- ======================================================== -->
  <line x1="940" y1="50" x2="940" y2="250" stroke="#334155" stroke-width="1.5" stroke-dasharray="4,4" opacity="0.7"/>

  <g transform="translate(970, 0)">
    <!-- PUQ Software Logo Group -->
    <g transform="translate(95, 95)">
      <text x="0" y="0" font-family="Arial, sans-serif" font-size="44" font-weight="bold" fill="#00a4e4" text-anchor="middle">PUQ</text>
      <text x="0" y="28" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="#94a3b8" text-anchor="middle" letter-spacing="4">SOFTWARE</text>
    </g>

    <!-- Official Integration Badge -->
    <g transform="translate(15, 175)">
      <rect x="0" y="0" width="160" height="42" rx="8" fill="#111c38" stroke="#00a4e4" stroke-width="1.5" stroke-opacity="0.6"/>
      <circle cx="24" cy="21" r="9" fill="#0082c9"/>
      <polyline points="20,21 23,24 29,18" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <text x="42" y="25" font-family="Arial, sans-serif" font-size="11" font-weight="bold" fill="#93c5fd" letter-spacing="1">MARKETPLACE</text>
    </g>
  </g>
</svg>
